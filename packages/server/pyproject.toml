[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "cellmetpro-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.32",
]


[project.optional-dependencies]
dev = ["pytest>=8", "httpx2", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]


[project.scripts]
cellmetpro-server = "cellmetpro_server.main:run"


[tool.ruff]
target-version = "py310"
line-length = 88


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


[tool.ruff.lint.isort]
known-first-party = ["cellmetpro_server"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]


[[tool.mypy.overrides]]
module = "cellmetpro_server.routers.*"
disable_error_code = ["untyped-decorator"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
